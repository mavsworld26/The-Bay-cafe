<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc3e0"/>
      <stop offset="0.55" stop-color="#bfe1ef"/>
      <stop offset="1" stop-color="#e7f2ee"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8fa0"/>
      <stop offset="0.4" stop-color="#1f7484"/>
      <stop offset="1" stop-color="#0d4a56"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.38" cy="1" r="0.9">
      <stop offset="0" stop-color="#fff6df" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff6df" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="500" width="1600" height="120" fill="url(#sun)"/>

  <!-- distant skyline -->
  <g fill="#7fa6ad" opacity="0.4">
    <rect x="1080" y="430" width="30" height="90"/>
    <rect x="1120" y="410" width="42" height="110"/>
    <rect x="1170" y="440" width="26" height="80"/>
    <rect x="1205" y="400" width="46" height="120"/>
    <rect x="1260" y="425" width="30" height="95"/>
    <rect x="1300" y="445" width="24" height="75"/>
  </g>

  <!-- water -->
  <rect y="510" width="1600" height="390" fill="url(#water)"/>
  <g stroke="#eaf7fa" stroke-width="2" opacity="0.22">
    <path d="M0,560 Q400,548 800,562 T1600,556"/>
    <path d="M0,610 Q420,596 840,612 T1600,604"/>
    <path d="M0,670 Q380,656 780,672 T1600,662"/>
    <path d="M0,740 Q460,724 900,742 T1600,730"/>
    <path d="M0,820 Q420,804 860,822 T1600,810"/>
  </g>

  <!-- pier / boardwalk -->
  <g fill="#d9d2c1">
    <path d="M0,720 L660,566 L700,566 L0,760 Z"/>
  </g>
  <g stroke="#c8c0aa" stroke-width="3" opacity="0.8">
    <path d="M0,700 L650,562" fill="none"/>
    <path d="M0,742 L668,570" fill="none"/>
  </g>
  <g stroke="#9d9480" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="700" x2="120" y2="640"/>
    <line x1="260" y1="672" x2="260" y2="618"/>
    <line x1="400" y1="644" x2="400" y2="598"/>
    <line x1="520" y1="620" x2="520" y2="582"/>
  </g>
  <!-- lamp post -->
  <g stroke="#5b5443" stroke-width="4" stroke-linecap="round">
    <line x1="260" y1="672" x2="260" y2="600"/>
  </g>
  <circle cx="260" cy="596" r="7" fill="#fff3d1" opacity="0.9"/>

  <!-- small figures on the pier -->
  <g fill="#33302a" opacity="0.75">
    <circle cx="430" cy="614" r="6"/>
    <rect x="424" y="620" width="12" height="22" rx="5"/>
    <circle cx="470" cy="608" r="5"/>
    <rect x="465" y="613" width="10" height="19" rx="4"/>
  </g>

  <!-- overhanging tree canopy, top-right -->
  <g fill="#1c3a2c">
    <path d="M1600,0 L1600,430 C1500,440 1430,410 1400,360 C1370,320 1380,270 1340,250 C1300,230 1260,260 1230,230 C1200,200 1220,150 1180,130 C1140,110 1120,150 1090,120 C1060,90 1080,40 1040,20 C1010,4 990,0 990,0 Z"/>
  </g>
  <g fill="#274d3a" opacity="0.9">
    <path d="M1600,40 C1520,30 1460,70 1450,130 C1440,190 1480,220 1460,270 C1440,320 1390,320 1400,380 C1410,420 1470,430 1500,410 C1560,430 1600,420 1600,420 Z"/>
  </g>
  <g fill="#356651" opacity="0.85">
    <circle cx="1250" cy="180" r="55"/>
    <circle cx="1380" cy="140" r="70"/>
    <circle cx="1500" cy="220" r="90"/>
    <circle cx="1160" cy="260" r="46"/>
  </g>

  <!-- café awning silhouette, bottom right -->
  <g fill="#20221f">
    <path d="M1330,900 L1330,760 C1330,730 1360,712 1400,712 L1600,712 L1600,900 Z"/>
    <path d="M1310,760 L1610,760 L1600,712 L1330,712 Z"/>
  </g>
  <g fill="#7fbf5a" opacity="0.9">
    <rect x="1370" y="800" width="46" height="46" rx="6"/>
    <rect x="1460" y="820" width="46" height="46" rx="6"/>
  </g>
</svg>
